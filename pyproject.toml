[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gfinance"
version = "2.0.0"
description = "Production-grade Google Finance API library with auto-healing, async support, and FastAPI server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "gfinance contributors"}]
keywords = ["google", "finance", "api", "stocks", "market", "crypto", "chart", "financial"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
async = ["aiohttp>=3.8.0"]
fastapi = ["fastapi>=0.100.0", "uvicorn>=0.20.0"]
heal = ["playwright>=1.30.0"]
data = ["pandas>=1.5.0"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "httpx>=0.24.0"]
all = ["gfinance[async,fastapi,heal,data,dev]"]

[project.scripts]
gfinance-server = "gfinance.fastapi_cli:main"

[tool.setuptools.packages.find]
include = ["gfinance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
